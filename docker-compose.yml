services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    volumes:
      - ./backend:/code
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/src
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    working_dir: /src
    command: 'npm run dev'
    environment:
      - VITE_API_URL=http://localhost:${NGINX_PORT}/api

  nginx:
    build: ./nginx
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d

volumes:
  postgres_data:
  frontend_node_modules:
